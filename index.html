<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWS Management Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f0f2f5;
            overflow: hidden;
        }

        /* Sidebar container */
        #sidebar {
            width: 210px;
            background-color: #2c3e50;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        #sidebar h2 {
            color: #ecf0f1;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 10px;
        }

        .nav-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .btn {
            background-color: #34495e;
            color: #bdc3c7;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            line-height: 1.3;
            display: block;
        }

        .btn:hover {
            background-color: #1abc9c;
            color: white;
        }

        .btn.active {
            background-color: #1abc9c;
            color: white;
            font-weight: bold;
        }

        /* Specific color for Calculator */
        .btn-calc {
            background-color: #8e44ad;
            color: white;
        }
        .btn-calc:hover {
            background-color: #9b59b6;
        }

        .btn-login {
            background-color: #2980b9;
            color: white;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #34495e;
            color: #7f8c8d;
            font-size: 10px;
        }

        #main-view {
            flex-grow: 1;
            border: none;
            height: 100%;
            background-color: white;
        }

        @media (max-width: 768px) {
            #sidebar { width: 160px; }
            .btn { font-size: 11px; }
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <h2>SWS Tools</h2>
        
        <div class="nav-group">
            <button class="btn" onclick="loadPage('logic', 'https://rob-hyrons.github.io/SWS_logic_calculator/')" id="btn-logic">
                Logic Calculator
            </button>
            
            <button class="btn" onclick="loadPage('hoods', 'https://rob-hyrons.github.io/SWS_steel_hoods/')" id="btn-hoods">
                Steel Hoods
            </button>
            
            <button class="btn" onclick="loadPage('bomb', 'https://rob-hyrons.github.io/Drive-and-Saftey-brake/')" id="btn-bomb">
                Bomb Costings Tool
            </button>
            
            <button class="btn" onclick="loadPage('timings', 'https://rob-hyrons.github.io/production-timings/')" id="btn-timings">
                Production Timings
            </button>
            
            <button class="btn" onclick="loadPage('ordering', 'https://rob-hyrons.github.io/Part-assembly-ordering-/')" id="btn-ordering">
                Part Assembly Order Form
            </button>

            <button class="btn" onclick="loadPage('evo', 'https://rob-hyrons.github.io/EVO_3d_model/')" id="btn-evo">
                EVO 3D Model
            </button>
            
            <!-- Fixed ID to match naming convention: btn-size-charts -->
            <button class="btn" onclick="loadPage('size-charts', 'https://rob-hyrons.github.io/SWS-size-charts/')" id="btn-size-charts">
               SWS Size Charts
            </button>
            
            <!-- Margin Calculator Button -->
            <button class="btn btn-calc" onclick="loadMarginCalc()" id="btn-margin">
                Margin Calculator
            </button>

            <a href="https://online.swsuk.co.uk/login" target="_blank" class="btn btn-login">
                Online Login ↗
            </a>
        </div>

        <div class="sidebar-footer">
            <p><strong>Version History</strong></p>
            <p>Current: v1.02</p>
        </div>
    </nav>

    <iframe id="main-view" name="main-view"></iframe>

    <script>
        const pages = {
            'logic': 'https://rob-hyrons.github.io/SWS_logic_calculator/',
            'hoods': 'https://rob-hyrons.github.io/SWS_steel_hoods/',
            'bomb': 'https://rob-hyrons.github.io/Drive-and-Saftey-brake/',
            'timings': 'https://rob-hyrons.github.io/production-timings/',
            'ordering': 'https://rob-hyrons.github.io/Part-assembly-ordering-/',
            'evo': 'https://rob-hyrons.github.io/EVO_3d_model/', /* Added missing comma here */
            'size-charts': 'https://rob-hyrons.github.io/SWS-size-charts/' /* Fixed key name */
        };

        function loadPage(key, url) {
            const iframe = document.getElementById('main-view');
            
            // FIX: Explicitly clear the internal calculator content 
            // so the external link is allowed to load.
            iframe.removeAttribute('srcdoc'); 
            
            iframe.src = url;
            window.location.hash = key;
            updateActiveState('btn-' + key);
        }

        function updateActiveState(btnId) {
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(btnId);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function loadMarginCalc() {
            window.location.hash = 'margin';
            updateActiveState('btn-margin');
            
            const calcHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #f4f7f6; display: flex; justify-content: center; }
                        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
                        h2 { color: #2c3e50; margin-top: 0; font-size: 22px; }
                        .input-group { margin-bottom: 20px; }
                        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; font-size: 14px; }
                        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
                        input:focus { outline: none; border-color: #8e44ad; box-shadow: 0 0 5px rgba(142, 68, 173, 0.2); }
                        .result { background: #f9f0ff; padding: 20px; border-radius: 8px; border: 1px solid #8e44ad; margin-top: 20px; text-align: center; }
                        .result-label { font-size: 12px; color: #8e44ad; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
                        .result-price { font-size: 32px; font-weight: bold; color: #2c3e50; }
                    </style>
                </head>
                <body>
                    <div class="card">
                        <h2>Margin Calculator</h2>
                        <div class="input-group">
                            <label>Cost Value (£)</label>
                            <input type="number" id="cost" placeholder="0.00" oninput="calculate()" step="0.01">
                        </div>
                        <div class="input-group">
                            <label>Desired Margin (%)</label>
                            <input type="number" id="margin" placeholder="20" oninput="calculate()">
                        </div>
                        <div class="result">
                            <div class="result-label">Recommended Sale Price</div>
                            <div class="result-price" id="total">£0.00</div>
                        </div>
                    </div>
                    <script>
                        function calculate() {
                            const cost = parseFloat(document.getElementById('cost').value) || 0;
                            const margin = parseFloat(document.getElementById('margin').value) || 0;
                            if (margin >= 100) {
                                document.getElementById('total').innerText = "Error";
                                return;
                            }
                            // Formula: Sale Price = Cost / (1 - Margin/100)
                            const salePrice = cost / (1 - (margin / 100));
                            document.getElementById('total').innerText = "£" + salePrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        }
                    <\/script>
                </body>
                </html>
            `;
            const iframe = document.getElementById('main-view');
            iframe.srcdoc = calcHtml;
        }

        window.onload = function() {
            const hash = window.location.hash.replace('#', '');
            if (hash === 'margin') {
                loadMarginCalc();
            } else if (hash && pages[hash]) {
                loadPage(hash, pages[hash]);
            } else {
                loadPage('logic', pages['logic']);
            }
        };
    </script>
</body>
</html>
